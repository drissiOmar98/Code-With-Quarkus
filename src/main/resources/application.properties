# =============================================================================
# Datasource configuration
# MySQL Sakila sample database (started via docker-compose.yml)
# =============================================================================

# JDBC driver class for MySQL
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver

# JDBC connection URL: jdbc:mysql://<host>:<port>/<database>
# The port must match the host port mapped in docker-compose.yml
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/sakila


# MySQL version of the restsql/mysql-sakila image (Hibernate generates SQL compatible with 5.7)
quarkus.datasource.db-version=5.7.17

# Database credentials (local development only, never commit real secrets)
quarkus.datasource.username=root
quarkus.datasource.password=sakila

# =============================================================================
# Hibernate ORM configuration
# =============================================================================

# Print the SQL statements generated by Hibernate to the console (useful for debugging)
quarkus.hibernate-orm.log.sql=true



# =============================================================================
# Health checks (SmallRye Health)
# Endpoints: /q/health, /q/health/live, /q/health/ready
# =============================================================================

# Built-in readiness check for the default datasource
quarkus.datasource.health.enabled=true

# Health UI (/q/health-ui) is dev/test only by default; keep it in packaged builds too
quarkus.smallrye-health.ui.always-include=true

# Document the health endpoints in the OpenAPI spec and Swagger UI
quarkus.smallrye-health.openapi.included=true